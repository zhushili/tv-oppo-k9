plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        debug {
            // Workspace copy of the standard Android debug key, so the build doesn't need to
            // create ~/.android/debug.keystore (read-only in some sandboxes).
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            // R8 strips unused AndroidX code for a smaller, faster-starting APK. Sideloaded over
            // adb only, so sign with the debug key to install over an existing debug build.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
